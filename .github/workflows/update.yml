name: Update sports data

on:
  schedule:
    - cron: "30 4 * * *"    # 06:30 local summer time: last night's NHL results, overnight F1 changes
    - cron: "0 18 * * *"    # 20:00 local: same-day F1 sessions and ski results
    - cron: "40 * * * 5,6,0"  # hourly Fri-Sun (UTC): F1 sprint/qualifying/race and ski results soon after they finish
  workflow_dispatch: {}     # manual run from the Actions tab

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Aggregate (standard library only)
        run: python scripts/aggregate.py f1 f1race nhl ski
      - name: Commit changed data
        run: |
          git config user.name "sports-data-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/
          if git diff --cached --quiet; then echo "no changes"; else git commit -m "data: $(date -u +%Y-%m-%dT%H:%MZ)" && git pull --rebase -q && git push; fi
